name: Build PinIt

# Builds the C++/Qt app, bundles the Qt runtime, and produces the Windows
# installer on every push/PR. Tagging a version (e.g. v1.0.0) also publishes
# the installer to a GitHub Release.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:        # lets you run it manually from the Actions tab

# Read-only by default. Only the release job below — which runs for version
# tags alone — is allowed to write (create the GitHub Release).
permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (the tag is in the
# comment) so a moved or compromised tag cannot change what runs here.
jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Install Qt (6.8 LTS, MinGW)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125   # v4
        with:
          # 6.8 LTS — the CI Qt mirror (aqtinstall) doesn't carry 6.11 yet.
          # The app uses only standard Qt 6 Widgets APIs, so it builds the same.
          version: '6.8.1'
          host: windows
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310'
          cache: true

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure (CMake)
        shell: pwsh
        run: >
          cmake -S . -B build -G "MinGW Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Test
        shell: pwsh
        run: ctest --test-dir build --output-on-failure

      - name: Bundle Qt runtime (windeployqt)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\PinIt | Out-Null
          Copy-Item build\PinIt.exe dist\PinIt\
          # PinIt needs only the platform plugin: PNG decoding is built into
          # Qt GUI and the Fusion style into Qt Widgets. Skipping the other
          # plugin types also drops the libraries only they depend on
          # (Qt6Network via the TUIO touch plugin, Qt6Svg) — about 4 MB.
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --skip-plugin-types imageformats,iconengines,generic,networkinformation,tls,styles dist\PinIt\PinIt.exe
          # Drop the Direct3D shader compiler — a Widgets app doesn't need it (~27 MB).
          Remove-Item dist\PinIt\dxcompiler.dll,dist\PinIt\dxil.dll -ErrorAction SilentlyContinue

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PinIt.iss

      - name: Make portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist\PinIt\* -DestinationPath release\PinIt-portable-x64.zip -Force

      # A copy of the installer under a name that doesn't change between
      # versions, so https://github.com/<repo>/releases/latest/download/PinIt-setup-x64.exe
      # always points at the newest one.
      - name: Add a stable-named installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\PinIt_*_x64-setup.exe | Select-Object -First 1
          Copy-Item $installer.FullName release\PinIt-setup-x64.exe

      # Lets anyone check a download against what CI built.
      - name: Write checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          # LF line endings: with CRLF, `sha256sum -c` on Linux/macOS/Git Bash
          # reads the carriage return as part of each file name and fails.
          [IO.File]::WriteAllText("$PWD\release\SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          Get-Content release\SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: PinIt-windows
          path: release\*
          if-no-files-found: error

  release:
    name: Publish to Release (on tag)
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the Release and upload its assets

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: PinIt-windows
          path: release

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2
        with:
          name: PinIt ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
